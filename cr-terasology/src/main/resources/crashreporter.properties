# Field IDs in Terasology's .github/ISSUE_TEMPLATE/crash-bug-report.yml (MovingBlocks/Terasology#5390).
REPORT_ISSUE_FIELD_VERSION=terasology_version
REPORT_ISSUE_FIELD_OS=operating_system
REPORT_ISSUE_FIELD_JAVA=java_version
REPORT_ISSUE_FIELD_DETAILS=actual_behavior
REPORT_ISSUE_FIELD_LOG=log_details
REPORT_ISSUE_FIELD_EXTRA=additional_context

# Two fixed lines the engine logs at startup: TerasologyVersion#toString's
# "[buildNumber=..., displayVersion=X, engineVersion=Y]" block, and RegisterMods'
# "Activating module: <id>:<version>" once per active module. Properties-file escaping: \\ is one backslash.
CRASH_SUMMARY_PRODUCT_NAME=Terasology
CRASH_SUMMARY_VERSION_PATTERN=engineVersion=([^,\\]]*)
CRASH_SUMMARY_DISPLAY_VERSION_PATTERN=displayVersion=([^,\\]]*)
CRASH_SUMMARY_MODULE_PATTERN=Activating module: (\\S+:\\S+)

RES_BANNER_IMAGE=icons/banner.jpg
RES_SERVER_ICON=icons/server.png
